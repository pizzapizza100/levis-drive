# cspell:disable

[package]
name = "levis_drive"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
env_logger = "0.11"
dotenv = "0.15"
reqwest = { version = "0.11", features = ["blocking"] }
once_cell = "1.19"
chrono = "0.4"
rand = "0.8"
tokio = { version = "1.43", features = ["full"] }
thiserror = "1.0"
tokio-postgres = "0.7"
rustls = "0.21.0"
rustls-pemfile = "2.0"
tokio-rustls = "0.24"

[profile.release]
strip = "debuginfo"
